name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/poolr_test?replicaSet=rs0
      JWT_SECRET: poolr-ci-only-secret-that-is-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Type-check tests
        run: npm run test:typecheck

      - name: Start MongoDB replica set
        run: docker compose up --detach --wait --wait-timeout 120 mongo

      - name: Run automated tests
        run: npm test

      - name: Show MongoDB logs after failure
        if: failure()
        run: docker compose logs mongo

      - name: Stop test infrastructure
        if: always()
        run: docker compose down --volumes
